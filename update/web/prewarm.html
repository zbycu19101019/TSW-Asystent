<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Przygotowanie głosów</title>
<script>
/* Przygotowanie nagrań lektora dla jednego języka i głosu (uruchamiane z panelu w ukrytej ramce).
   Własna pamięć ustawień (bez localStorage strony), więc nie zmienia języka ani głosu ekranów. */
(function () {
  const q = new URLSearchParams(location.search);
  const store = { tswLang: q.get('lang') || 'pl', tswAccent: q.get('accent') || 'gb', tswVoiceMode: q.get('voice') || 'marek', tswVoiceEngine: 'radio', tswFx: 'client' };
  const mem = { getItem: (k) => (k in store ? store[k] : null), setItem: (k, v) => { store[k] = String(v); }, removeItem: (k) => { delete store[k]; }, clear() {} };
  try { Object.defineProperty(window, 'localStorage', { value: mem, configurable: true }); } catch (_) {}
  window.TSW_DEMO = 1;   // bez wpisów w dzienniku lektora
})();
</script>
<script src="/tsw-phon.js"></script>
<script src="/tsw-i18n.js"></script>
<script src="/i18n/pl.js"></script>
<script src="/i18n/de.js"></script>
<script src="/i18n/en.js"></script>
<script src="/tsw-fx.js"></script>
<script src="/i18n/cab-dict.js"></script>
<script src="/tsw-cab.js"></script>
<script src="/tsw-msg.js"></script>
</head><body>
<script>
(async () => {
  // wiadomości wyłącznie do okna programu z tego samego źródła (nigdy '*')
  const tell = (m) => { try { parent.postMessage(Object.assign({ type: 'OFFLINE_PACK' }, m), location.origin); } catch (_) {} };
  try {
    const V = window.TswVoice(), items = window.TswMsgPrewarm().map((q) => V.payload(q.text, q.lvl));
    const r = await fetch('/api/app/offline-pack', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start', items }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.msg || ('HTTP ' + r.status));
    tell({ status: 'started', total: j.total });
  } catch (e) { tell({ status: 'error', msg: String((e && e.message) || e) }); }
})();
</script>
</body></html>
